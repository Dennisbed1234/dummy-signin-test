<!DOCTYPE html>
<html>
<head>
  <title>Dummy Sign-In Test</title>
</head>
<body>

  <h1>Dummy Sign-In</h1>

  <!-- Step 1: Email + Password -->
  <div id="step1">
    <h2>Step 1: Email and Password</h2>
    <form id="form1">
      <label>Email: <input type="email" id="email" required></label><br><br>
      <label>Password: <input type="password" id="password" required></label><br><br>
      <button type="submit">Continue</button>
    </form>
  </div>

  <!-- Step 2: Username -->
  <div id="step2" style="display:none;">
    <h2>Step 2: Username</h2>
    <form id="form2">
      <label>Username: <input type="text" id="username" required></label><br><br>
      <button type="submit">Continue</button>
    </form>
  </div>

  <!-- Step 3: OTP 1 -->
  <div id="step3" style="display:none;">
    <h2>Step 3: OTP 1</h2>
    <p>OTP 1 has been sent (dummy).</p>
    <form id="form3">
      <label>OTP 1: <input type="text" id="otp1" required></label><br><br>
      <button type="submit">Continue</button>
    </form>
  </div>

  <!-- Step 4: OTP 2 -->
  <div id="step4" style="display:none;">
    <h2>Step 4: OTP 2</h2>
    <p>OTP 2 has been sent (dummy).</p>
    <form id="form4">
      <label>OTP 2: <input type="text" id="otp2" required></label><br><br>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <!-- Success -->
  <div id="success" style="display:none;">
    <h2>Sign-in successful (dummy)</h2>
    <p>You are now signed in with dummy credentials.</p>
    <pre id="summary"></pre>
  </div>

  <script>
    const data = {};

    document.getElementById('form1').addEventListener('submit', function(e) {
      e.preventDefault();
      data.email = document.getElementById('email').value;
      data.password = document.getElementById('password').value;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    });

    document.getElementById('form2').addEventListener('submit', function(e) {
      e.preventDefault();
      data.username = document.getElementById('username').value;
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
    });

    document.getElementById('form3').addEventListener('submit', function(e) {
      e.preventDefault();
      data.otp1 = document.getElementById('otp1').value;
      document.getElementById('step3').style.display = 'none';
      document.getElementById('step4').style.display = 'block';
    });

    document.getElementById('form4').addEventListener('submit', function(e) {
      e.preventDefault();
      data.otp2 = document.getElementById('otp2').value;
      document.getElementById('step4').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      document.getElementById('summary').textContent = JSON.stringify(data, null, 2);
    });
  </script>

</body>
</html>
